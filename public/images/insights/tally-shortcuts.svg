<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#006569"/>
      <stop offset="100%" stop-color="#0ea5a5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="160" fill="url(#g3)"/>
  <text x="60" y="95" font-size="48" fill="#fff" font-weight="800" font-family="system-ui">Tally Prime Shortcut Keys</text>
  <text x="60" y="135" font-size="20" fill="#e0f2f2" font-family="system-ui">Complete List for Faster Data Entry</text>
  <g transform="translate(60,200)">
    <rect width="340" height="180" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="30" y="50" font-size="36" font-weight="800" fill="#006569" font-family="monospace">Ctrl+A</text>
    <text x="30" y="90" font-size="18" fill="#334155" font-family="system-ui">Accept / Save Voucher</text>
  </g>
  <g transform="translate(430,200)">
    <rect width="340" height="180" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="30" y="50" font-size="36" font-weight="800" fill="#0f766e" font-family="monospace">Alt+F12</text>
    <text x="30" y="90" font-size="18" fill="#334155" font-family="system-ui">Configure</text>
  </g>
  <g transform="translate(800,200)">
    <rect width="340" height="180" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="30" y="50" font-size="36" font-weight="800" fill="#14b8a6" font-family="monospace">Alt+F2</text>
    <text x="30" y="90" font-size="18" fill="#334155" font-family="system-ui">Change Date</text>
  </g>
  <g transform="translate(60,400)">
